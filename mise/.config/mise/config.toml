[tools]
# Language runtimes
node = 'lts'
python = '3'
ruby = 'latest'
go = 'latest'
rust = 'latest'

# CLI tools
bun = 'latest'
claude-code = '2.1.220'
delta = 'latest'
fzf = 'latest'
gh = 'latest'
herdr = 'latest'
jq = 'latest'
lazygit = 'latest'
# 'latest' resolves to a date-stamped pseudo-version (e.g. 2.1.1744318430)
# that has no matching git tag, so the asdf plugin's clone fails. Pin to the
# rolling release tag that upstream actually publishes.
# Backend MUST be explicit: unprefixed `luajit` resolves to the first registry
# entry (conda:luajit), whose solver has no `2.1.rolling` candidate and fails on
# machines where mise's conda backend is reachable. The ROLLING tag only exists
# for the asdf plugin.
"asdf:mise-plugins/mise-luaJIT" = '2.1.ROLLING'
neovim = 'latest'
opencode = 'latest'
pipx = 'latest'
ripgrep = 'latest'
shellcheck = 'latest'
starship = 'latest'
tmux = 'latest'
# Required by nvim-treesitter's `main` branch to compile parsers from source
# (the old `master` branch fetched precompiled parsers and needed no CLI).
tree-sitter = 'latest'
# vivid 0.11.0 is advertised upstream, but the aqua backend has no usable macOS asset yet.
vivid = '0.10.1'
yt-dlp = 'latest'
zoxide = 'latest'

# Backend-specific tools
# eza ships no macOS release binaries, so the asdf plugin pulls from
# cargo-quickinstall, which 404s whenever a tag has no prebuilt macOS asset yet.
# Build from source via cargo instead — reliable, and tracks the crates.io release.
"cargo:eza" = 'latest'
"github:backnotprop/plannotator" = 'latest'
"npm:@openai/codex" = 'latest'  # OpenAI Codex CLI
# aqua's ollama-darwin.tgz trips mise's tar reader ("malformed pax extension"),
# so use the asdf plugin, which extracts the same upstream tarball cleanly.
"asdf:virtualstaticvoid/asdf-ollama" = 'latest'
"npm:hunkdiff" = 'latest'  # review-first terminal diff viewer; provides `hunk`
"github:eduardofuncao/squix" = 'latest'  # SQL query stash TUI; provides `squix`
"npm:pnpm" = 'latest'
"npm:yarn" = 'latest'
'gem:tmuxinator' = 'latest'
'go:golang.org/x/tools/gopls' = 'latest'
'pipx:sqlit-tui' = 'latest'
"github:sharkdp/vivid" = "latest"

[settings]
idiomatic_version_file = true
not_found_auto_install = true
python = { compile = false }
experimental = true

[env]
EDITOR = 'nvim'
LUAROCKS_VERSION = '3.12.2'
